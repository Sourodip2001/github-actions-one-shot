

name: CI

on:
  workflow_dispatch: 
jobs:
  code:
    runs-on: ubuntu-latest
    steps:
      - name: clone code
        run: echo "cloning code"
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
  build:
    runs-on: ubuntu-slim
    steps:
      - name: build using docker
        run: echo "docker build"
  test:
    needs: 
      - build
    runs-on: ubuntu-latest
    steps:
      - name: running test cases
        run: echo "testing app"
  deploy:
    needs: 
    - test
    runs-on: ubuntu-latest
    steps:
      - name: deploy on machine
        run: echo "deploy on machine"
  

